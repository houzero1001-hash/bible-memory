<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bible Memory 浏览器集成验证</title><style>body{font:16px/1.7 system-ui;padding:24px;max-width:700px;margin:auto;color:#203d34;background:#f6f5ef}.pass{color:#235f4c}.fail{color:#b22}</style><h1>浏览器集成验证</h1><p>仅使用独立的 bible-memory-qa 数据库，不修改应用经文。</p><div id="results"></div><strong id="summary">执行中…</strong><script type="module">
import {createLookupUI} from '/bible-memory/src/lookup-ui.js';
import {openDB,read,write} from '/bible-memory/src/storage.js';import {fresh,createVerse,grade,backup,mergeBackup,defaults,due,nextNew,duplicate,createSermon,upgradeState,validateBackup} from '/bible-memory/src/core.js';
let pass=0,fail=0;const out=document.querySelector('#results');async function check(name,fn){try{await fn();pass++;out.insertAdjacentHTML('beforeend',`<p class="pass">✓ ${name}</p>`);}catch(e){fail++;out.insertAdjacentHTML('beforeend',`<p class="fail">✗ ${name}: ${e.message}</p>`);}}const eq=(a,b)=>{if(JSON.stringify(a)!==JSON.stringify(b))throw Error('结果不一致');};let db=await openDB('bible-memory-qa'),s=fresh();s.revision=(await read(db))?.revision||0;s.verses=[createVerse('测试 1:1','  多行。\n\nEnglish words.  ','测试版本')];
await check('IndexedDB 写入与读取原文、版本',async()=>{await write(db,s);eq(await read(db),s);});
await check('关闭数据库连接后重开，内容保留',async()=>{db.close();db=await openDB('bible-memory-qa');eq(await read(db),s);});
await check('隐藏阶段中断后恢复',async()=>{s.session={verseId:s.verses[0].id,kind:'new',phase:'hidden',usedHint:true};await write(db,s);db.close();db=await openDB('bible-memory-qa');eq((await read(db)).session,s.session);});
await check('三种结果与完整历史持久化',async()=>{grade(s.verses[0],'fail',defaults,'2026-01-01','new');grade(s.verses[0],'hint',defaults,'2026-01-02','review',true);grade(s.verses[0],'success',defaults,'2026-01-03');s.session=null;await write(db,s);eq((await read(db)).verses[0].history,s.verses[0].history);});
await check('JSON 备份恢复包含原文及全部历史',async()=>{const restored=mergeBackup(fresh(),JSON.parse(JSON.stringify(backup(s)))).state;restored.revision=s.revision;await write(db,restored);s.revision=restored.revision;eq((await read(db)).verses,s.verses);});
await check('重复恢复不会复制或覆盖经文',async()=>{const restored=mergeBackup(s,backup(s));eq(restored.added,0);eq(restored.skipped,1);eq(restored.state.verses,s.verses);});
await check('到期复习与新任务分开',async()=>{eq(due(s,'2026-01-06').length,1);eq(nextNew(s,'2026-01-06'),null);});
await check('摘句正文、感悟、主题及会话真实落盘并可重新打开',async()=>{s.sermons=[createSermon({text:' 测试摘句。\n第二行。 ',topic:'信心',reflection:'测试感悟',quotationType:'paraphrase'})];s.session={collection:'sermons',verseId:s.sermons[0].id,phase:'hidden',kind:'new',usedHint:true};await write(db,s);db.close();db=await openDB('bible-memory-qa');eq((await read(db)).sermons,s.sermons);eq((await read(db)).session,s.session);});
await check('v2 备份包含两类记录并能完整导入',async()=>{const b=JSON.parse(JSON.stringify(backup(s)));validateBackup(b);const r=mergeBackup(fresh(),b);eq(r.state.verses,s.verses);eq(r.state.sermons,s.sermons);});
await check('另一个页面已保存时，陈旧页面写入被拒绝',async()=>{const first=await read(db),stale=structuredClone(first);first.settings.dailySermon=2;await write(db,first);let rejected=false;try{await write(db,stale);}catch{rejected=true;}if(!rejected)throw Error('未拒绝陈旧写入');eq((await read(db)).settings.dailySermon,2);s=first;});
await check('旧版本升级前保留恢复快照',async()=>{const legacy={...fresh(),schemaVersion:1,revision:s.revision};delete legacy.sermons;delete legacy.settings.dailySermon;await write(db,legacy);const upgraded=upgradeState(legacy);await write(db,upgraded);const snapshot=await new Promise((resolve,reject)=>{const r=db.transaction('state').objectStore('state').get('before-sermons-v2');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});eq(snapshot.schemaVersion,1);eq((await read(db)).schemaVersion,2);});
db.close();
const frame=document.createElement('iframe');frame.style.cssText='display:block;border:1px solid #ccc;height:740px;max-width:none;';frame.src='/bible-memory/';document.body.append(frame);await new Promise(resolve=>frame.onload=resolve);await new Promise(resolve=>{if(frame.contentDocument.querySelector('h1'))return resolve();const observer=new MutationObserver(()=>{if(frame.contentDocument.querySelector('h1')){observer.disconnect();resolve();}});observer.observe(frame.contentDocument.body,{childList:true,subtree:true});});
for(const width of [320,375,390,1440])await check(`${width}px 布局无横向溢出、按钮至少 48px`,async()=>{frame.style.width=width+'px';await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));const d=frame.contentDocument;if(d.documentElement.scrollWidth>width)throw Error('页面横向溢出');for(const b of d.querySelectorAll('button'))if(b.getBoundingClientRect().height<48)throw Error('按钮过小');});
await check('320px 添加表单无横向溢出、正文字号至少 16px',async()=>{frame.style.width='320px';frame.contentDocument.querySelector('[data-action="add"]').click();await new Promise(r=>requestAnimationFrame(r));const d=frame.contentDocument;if(d.documentElement.scrollWidth>320)throw Error('表单溢出');if(parseFloat(frame.contentWindow.getComputedStyle(d.querySelector('textarea')).fontSize)<16)throw Error('输入框文字过小');});
await check('320px 讲道摘句表单无横向溢出，感悟与正文分开',async()=>{frame.contentDocument.querySelector('[data-page="sermons"]').click();frame.contentDocument.querySelector('[data-action="add-sermon"]').click();await new Promise(r=>requestAnimationFrame(r));const d=frame.contentDocument;if(d.documentElement.scrollWidth>320)throw Error('摘句表单溢出');if(!d.querySelector('[name="reflection"]')||!d.querySelector('[name="text"]'))throw Error('缺少独立字段');});frame.remove();
const sandbox=document.createElement('div');document.body.append(sandbox);const lookupState=fresh();const result={reference:'约翰福音 3:16',text:'  测试经文。\nEnglish test.  ',version:'和合本（简体）',source:{provider:'getBible',url:'https://api.getbible.net/v2/cus/43/3.json',copyright:'Public Domain',versionId:'cus'}};const escape=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');let ui;ui=createLookupUI({root:sandbox,esc:escape,btn:(a,t)=>`<button data-action="${a}">${t}</button>`,getState:()=>lookupState,mutate:async fn=>fn(),go:()=>{},message:()=>{},createVerse,duplicate,lookupPassage:async(ref,version)=>{if(version==='kjv')throw Error('KJV 测试：网络不可用');return structuredClone(result);}});ui.render();sandbox.querySelector('[name="version"]').value='cuv';
await check('在线查询只预览，不自动收藏',async()=>{sandbox.querySelector('[name="reference"]').value='约翰福音 3:16';await ui.submit(sandbox.querySelector('form'));eq(lookupState.verses.length,0);if(!sandbox.querySelector('[data-lookup-save]'))throw Error('没有确认按钮');eq(sandbox.querySelector('.verse').textContent,result.text);});
await check('确认收藏保留原文、版本和版权来源，进入待背诵',async()=>{await ui.save(0);eq(lookupState.verses.length,1);eq(lookupState.verses[0].status,'pending');eq(lookupState.verses[0].history.length,0);eq(lookupState.verses[0].text,result.text);eq(lookupState.verses[0].source,result.source);});
await check('收藏后禁用重复确认按钮',async()=>{if(!sandbox.querySelector('[data-lookup-save]').disabled)throw Error('重复收藏按钮未禁用');});
await check('中英对照部分失败仍保留成功的中文预览',async()=>{sandbox.querySelector('[name="reference"]').value='约翰福音 3:16';sandbox.querySelector('[name="version"]').value='both';await ui.submit(sandbox.querySelector('form'));eq(sandbox.querySelectorAll('.verse').length,1);if(!sandbox.textContent.includes('KJV 测试：网络不可用'))throw Error('未展示失败原因');});sandbox.remove();
const pairedRoot=document.createElement('div');document.body.append(pairedRoot);const pairedState=fresh();const pairUI=createLookupUI({root:pairedRoot,esc:escape,btn:(a,t)=>`<button>${t}</button>`,getState:()=>pairedState,mutate:async fn=>fn(),go:()=>{},message:()=>{},createVerse,duplicate,lookupPassage:async(ref,version)=>version==='cuv'?structuredClone(result):{...structuredClone(result),version:'KJV',text:'English verse.',source:{...result.source,versionId:'kjv'}}});pairUI.render();
await check('中英对照合成一张卡片和一个收藏按钮',async()=>{pairedRoot.querySelector('[name="reference"]').value='约翰福音 3:16';await pairUI.submit(pairedRoot.querySelector('form'));eq(pairedRoot.querySelectorAll('[data-lookup-save]').length,1);if(!pairedRoot.textContent.includes('English verse.')||!pairedRoot.textContent.includes('【和合本】'))throw Error('双语原文未一起呈现');});
await check('一次确认收藏一个双语任务，备份保留双语',async()=>{await pairUI.save(0);eq(pairedState.verses.length,1);eq(pairedState.verses[0].version,'和合本 + KJV');eq(pairedState.verses[0].history.length,0);eq(backup(pairedState).verses[0].source.translations.length,2);});pairedRoot.remove();
document.querySelector('#summary').textContent=`${pass} 项通过，${fail} 项失败`;
</script>
